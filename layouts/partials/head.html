<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $title := cond .IsHome site.Title (printf "%s · %s" .Title site.Title) }}
<title>{{ $title }}</title>
{{ $desc := cond .IsHome site.Params.description (.Description | default .Summary | plainify | truncate 160) }}
<meta name="description" content="{{ $desc }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="{{ cond .IsPage "article" "website" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23141413'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23d97757'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%232a78d6'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%232a78d6'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23d97757'/%3E%3C/svg%3E">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .RelPermalink }}">{{ end }}
<link rel="preload" href="{{ "fonts/Newsreader-normal-300-700.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
