<!doctype html>
<html lang="{{ site.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body class="{{ .Kind }} {{ .Type }}">
  {{ partial "nav.html" . }}
  <main class="wrap">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/site.js" | fingerprint }}<script src="{{ .RelPermalink }}" defer></script>{{ end }}
</body>
</html>
