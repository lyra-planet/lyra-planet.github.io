projects:
  - title: "LyHarness · modular coding-agent runtime"
    url: "https://github.com/lyra-planet/LyHarness"
    when: Aug 2026 – present
    points:
      - "Runtime: configuration, runtime state and application services are separate layers, with one path for model calls, tool dispatch and lifecycle. File and shell tools, Git worktree isolation, skills, MCP tool discovery, permission hooks, retries and background scheduling."
      - "Collaboration and memory: persistent tasks and a file-based message bus for claiming work and syncing state. Persistent memory, context compaction, history recovery and spilling tool output to disk keep context small and let a run resume on another instance."
      - "Workflow recovery: structured, parallel sub-tasks with stage logs, run snapshots and a persistent journal to resume after interruption; an independent evaluator checks the goal and keeps the agent going. pytest covers the task lifecycle, tool execution, memory isolation and dedup, workflow runs and goal commands."
  - title: "Patchloom · multi-agent, self-evolving PR review and auto-fix"
    when: Sep 2026 – present
    points:
      - "Runtime harness: task state, budgets, retries and cancellation; checkpoints to resume, node-level records for replay and failure attribution; context compressed by risky hunks, observations and token budget; four-layer memory with tenant and repository isolation."
      - "Self-evolving orchestrator: a main agent dispatches security, reliability and critic sub-agents. False positives, misses, bad fixes and execution errors become prompt and skill candidates, which go live only after three gates, with dedup, versioning and rollback."
      - "Evaluated on 100 controlled PR diffs: review accuracy 92.5%, risk-detection F1 from 81.9% to 92.5%, high-risk recall from 84.2% to 94.7%."
  - title: "TencentDB-Agent-Memory · dynamic skill-queue injection (PR #1281)"
    url: "https://github.com/TencentCloud/TencentDB-Agent-Memory/pull/1281"
    when: Sep 2026 – present
    points:
      - "Three injection strategies for MemoryProxy (every_queue, latest_only, adaptive_queue) using BM25 over the latest user queue, with history snapshots, incremental injection and multi-turn state recovery."
      - "Compatible with the Codex and WorkBuddy protocols; immutable snapshots, a hook cache and session/queue isolation keep instances consistent. In a 100-task evaluation with 26 tests, latest_only reaches 91% success and adaptive_queue a 94.03% KV-cache hit rate."

